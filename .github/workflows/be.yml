name: Build and deploy api (Nest.js) to Azure Web App -pikai-api

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".github/workflows/be.yml"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client for Build
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npx prisma generate

      - name: Build
        run: pnpm turbo run build --filter=api

      # 워크스페이스와 분리해 독립 설치. hoisted 라야 심볼릭 링크 없이 담긴다.
      - name: Create deployment folder
        run: |
          rm -rf deploy-out

           pnpm --filter api deploy --prod deploy-out

           cp -r apps/api/dist deploy-out/dist

           if [ -d apps/api/prisma ]; then
             cp -r apps/api/prisma deploy-out/prisma
           fi

      - name: Zip deployment package
        run: |
          cd deploy-out
          zip -r ../release.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: api-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "pikai-api"
          slot-name: "staging"
          package: release.zip
          publish-profile: ${{ secrets.BE_PUBLISH_PROFILE }}
