name: Build and deploy api (Nest.js) to Azure Web App -pikai-api

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/common/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/be.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run prisma:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build API
        run: pnpm run build:api

      # 워크스페이스와 분리해 독립 설치. hoisted 라야 심볼릭 링크 없이 담긴다.
      - name: Create deployment folder
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          rm -rf deploy-out
          mkdir -p deploy-out
          mkdir -p deploy-out/dist
          mkdir -p deploy-out/src
          # 2. 빌드 결과물, 소스, package.json 및 lockfile 복사
          cp -R apps/api/dist/. deploy-out/dist/
          cp -R apps/api/src/. deploy-out/src/
          cp apps/api/package.json deploy-out/package.json
          # 3. Prisma 스키마 복사 (존재할 경우)
          if [ -d apps/api/prisma ]; then
            cp -r apps/api/prisma deploy-out/prisma
          fi

          # 4. deploy-out 내부에서 pnpm으로 독립 node_modules 설치
          cd deploy-out
          echo "shamefully-hoist=true" > .npmrc
          echo "node-linker=hoisted" >> .npmrc

          # npm 대신 pnpm을 사용하여 동결을 해제하고 프로덕션 전용 패키지 설치
          pnpm install --prod --no-frozen-lockfile

          # 5. 임시 설정 파일 정리
          rm -f .npmrc

      - name: Zip artifact for deployment
        run: cd deploy-out && zip -qr "$GITHUB_WORKSPACE/release.zip" .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: api-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: api-app

      - name: "Deploy to Azure Web App"
        uses: azure/webapps-deploy@v3
        with:
          app-name: "pikai-api"
          slot-name: "staging"
          package: release.zip
          publish-profile: ${{ secrets.BE_PUBLISH_PROFILE }}
