name: Build and deploy api (Nest.js) to Azure Web App -pikai-api

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/common/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/be.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run prisma:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build API
        run: pnpm build:api

      - name: Create deployment folder
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p deploy-out
          cp -r apps/api/dist deploy-out/dist
          cp -r apps/api/prisma deploy-out/prisma
          cp apps/api/prisma.config.ts deploy-out/prisma.config.ts
          cp apps/api/package.deploy.json deploy-out/package.json
          cp apps/api/start.sh deploy-out/start.sh
          chmod +x deploy-out/start.sh

          cd deploy-out
          npm install --omit=dev
          npx prisma generate

          # 의존성 검증
          test -f node_modules/@nestjs/core/package.json
          test -f node_modules/@nestjs/common/package.json
          test -f node_modules/@nestjs/platform-express/package.json
          test -f node_modules/prisma/package.json
          test -f node_modules/prisma/build/index.js
          test -f node_modules/tslib/package.json

          # .bin/prisma 가 wasm 을 .bin/ 에서 찾음 → 미리 복사
          cp -f node_modules/prisma/build/*.wasm node_modules/.bin/

          # Azure OneDeploy NodeProjectOptimizer 가 "node_modules" 폴더를 보면
          # tar로 압축하다 rsync 실패함 → 이름을 바꿔서 우회
          mv node_modules node_modules_app

          printf '%s\n' '[config]' 'SCM_DO_BUILD_DURING_DEPLOYMENT = false' > .deployment
          rm -f pnpm-lock.yaml node_modules.tar.gz app-node_modules.tar.gz

          echo "Artifact contents:"
          ls -la
          ls node_modules_app/@nestjs
          ls -la

      - name: Zip artifact for deployment
        run: cd deploy-out && zip -qr "$GITHUB_WORKSPACE/release.zip" .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: api-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: api-app

      - name: "Deploy to Azure Web App"
        uses: azure/webapps-deploy@v3
        with:
          app-name: "pikai-api"
          slot-name: "staging"
          package: release.zip
          publish-profile: ${{ secrets.BE_PUBLISH_PROFILE }}
