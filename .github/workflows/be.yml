name: Build and deploy api (Nest.js) to Azure Web App -pikai-api

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/common/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/be.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build API
        run: pnpm build:api

      # 워크스페이스와 분리해 독립 설치. hoisted 라야 심볼릭 링크 없이 담긴다.
      - name: Create deployment folder
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p deploy-out
          cp -r apps/api/dist deploy-out/dist
          cp -r apps/api/prisma deploy-out/prisma
          cp apps/api/prisma.config.ts deploy-out/prisma.config.ts
          cp apps/api/package.deploy.json deploy-out/package.json

          cd deploy-out
          # Azure는 pnpm/Oryx 조합에서 node_modules를 tar.gz로 깨뜨리기 쉬움 → npm으로 설치
          npm install --omit=dev
          npx prisma generate

          # Oryx가 재빌드하지 않도록
          printf '%s\n' '[config]' 'SCM_DO_BUILD_DURING_DEPLOYMENT = false' > .deployment
          # pnpm lock이 있으면 Azure가 pnpm/Oryx 경로로 갈 수 있어 제거
          rm -f pnpm-lock.yaml

      - name: Zip artifact for deployment
        run: cd deploy-out && zip -qr "$GITHUB_WORKSPACE/release.zip" .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: api-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: api-app

      - name: "Deploy to Azure Web App"
        uses: azure/webapps-deploy@v3
        with:
          app-name: "pikai-api"
          slot-name: "staging"
          package: release.zip
          publish-profile: ${{ secrets.BE_PUBLISH_PROFILE }}
